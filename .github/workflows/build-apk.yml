name: Build RuthMap Afterdark APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SM="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | head -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RuthMap-Afterdark-Willowbrook-v0.2-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RuthMap-Afterdark-Willowbrook-APK
          path: RuthMap-Afterdark-Willowbrook-v0.2-debug.apk
      - name: Publish direct-download pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2-beta >/dev/null 2>&1; then
            gh release upload v0.2-beta RuthMap-Afterdark-Willowbrook-v0.2-debug.apk --clobber
          else
            gh release create v0.2-beta RuthMap-Afterdark-Willowbrook-v0.2-debug.apk --prerelease --title "RuthMap Afterdark v0.2 beta" --notes "Standalone Willowbrook offline field survey prototype. Schematic map requires field calibration; pins are signal observation positions."
          fi
