name: Build RoadNav Waze-style Alpha
on:
  push:
    branches: [roadnav-waze-clone-alpha]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          SM="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' | head -1)"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk RoadNav-Alpha-v0.2.apk
          sha256sum RoadNav-Alpha-v0.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: RoadNav-Alpha-v0.2-APK
          path: RoadNav-Alpha-v0.2.apk
          if-no-files-found: error
      - name: Publish beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view roadnav-v0.2-colors >/dev/null 2>&1; then
            gh release upload roadnav-v0.2-colors RoadNav-Alpha-v0.2.apk --clobber
          else
            gh release create roadnav-v0.2-colors RoadNav-Alpha-v0.2.apk --target "$GITHUB_SHA" --title "RoadNav v0.2 Color Themes" --notes "Separate experimental open-source road navigation app. Contains GPS, MapLibre, three persisted street-map color themes, OSRM-based route preview and local hazards. No live traffic and NOT validated for use while driving." --prerelease
          fi
